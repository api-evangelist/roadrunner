name: Roadrunner
description: 'RoadRunner is a tech-enabled managed waste and recycling services company operating across
  all 50 US states, serving 14,000+ commercial customers in hospitality, healthcare, retail, logistics
  and manufacturing. It consolidates multi-location waste programs and layers proprietary optimization
  tooling (Oversite, Waste Metering, BillCheck, Priceshield) plus the RecycleMORE and CleanStream recycling
  programs on top of hauler networks. Backed by Fifth Wall and Kleiner Perkins in the climate sector.
  As of this enrichment pass RoadRunner publishes a marketing site and a customer + payment portal but
  no public developer/API surface, so no OpenAPI, SDK, MCP or event artifacts were found.'
